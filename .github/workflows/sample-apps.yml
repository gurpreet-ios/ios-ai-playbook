name: sample-apps

on:
  push:
    branches: [main]
    paths: ['sample-apps/**', '.github/workflows/sample-apps.yml']
  pull_request:
    paths: ['sample-apps/**', '.github/workflows/sample-apps.yml']

# Chapter 30's gate 1 applied to the book's own code: all sample apps must
# build for the iOS Simulator and pass their Swift Testing suites. The apps are
# the playbook's proof — a broken sample is a credibility bug, not a code bug.
#
# Runner split (see sample-apps/CI.md for the "why" and runner setup):
#   * pull_request -> free GitHub-hosted macos-15 (reproducible, always-on,
#     safe for fork PRs since untrusted code never touches a personal machine).
#   * push to main -> a self-hosted runner (a local Mac), used purely as a
#     learning exercise. Real CI would stay on GitHub-hosted Macs.
jobs:
  build-and-test:
    runs-on: ${{ github.event_name == 'push' && fromJSON('["self-hosted", "macOS"]') || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: movie-search-uikit
            scheme: MovieSearchUIKit
          - app: music-interview-app
            scheme: MusicInterviewApp
          - app: spotify-clone
            scheme: SpotifyClone
          - app: uber-clone
            scheme: UberClone
    defaults:
      run:
        working-directory: sample-apps
    steps:
      - uses: actions/checkout@v4

      # Point the build at the newest installed Xcode WITHOUT sudo. `sudo
      # xcode-select` would hang on a self-hosted Mac that lacks passwordless
      # sudo; exporting DEVELOPER_DIR works identically on hosted and local
      # runners. On the self-hosted Mac, symlink your Xcode into /Applications
      # (see sample-apps/CI.md) so this resolves it.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          XCODE="${XCODE:-/Applications/Xcode.app}"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install fastlane
        run: bundle install

      # The lane wraps `xcodebuild test` (fastlane's scan can't drive a bare
      # SwiftPM package) and resolves an available simulator UDID itself, so no
      # separate simulator-pick step is needed.
      - name: Build and test ${{ matrix.app }}
        run: bundle exec fastlane test scheme:${{ matrix.scheme }} directory:${{ matrix.app }}
